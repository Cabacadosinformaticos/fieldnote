[project]
name = "fieldnote-demo-data"
version = "0.1.0"
description = "Fill a running Fieldnote stack with the demonstration study through the public API"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pillow>=11.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
