[project]
name = "fieldnote-scheduler"
version = "0.1.0"
description = "Fieldnote scheduler"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
]

[project.scripts]
fieldnote-scheduler = "scheduler.main:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
