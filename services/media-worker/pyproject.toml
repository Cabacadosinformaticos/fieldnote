[project]
name = "fieldnote-media-worker"
version = "0.1.0"
description = "Fieldnote media worker"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
fieldnote-media-worker = "media_worker.main:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
