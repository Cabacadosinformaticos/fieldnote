[project]
name = "fieldnote-backup"
version = "0.1.0"
description = "Encrypted daily backups and restore drills for Fieldnote"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.123",
    "cryptography>=50.0.2",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
]

[project.scripts]
fieldnote-backup = "backup.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
