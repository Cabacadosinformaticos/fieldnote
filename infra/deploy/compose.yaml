name: fieldnote

networks:
  edge:
  cluster:

volumes:
  postgres-data:
  rabbitmq-data:
  garage-meta:
  garage-data:
  prometheus-data:
  grafana-data:

secrets:
  # The off-host backup key: 32 random bytes in a file outside the stack. Compose mounts it
  # read-only at /run/secrets/backup.key.
  backup_key:
    file: ./secrets/backup.key

x-api-build: &api-build
  context: ../../services/api

x-database-url: &database-url "postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
x-rabbitmq-url: &rabbitmq-url "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/"

services:
  traefik:
    profiles: ["dev"]
    restart: unless-stopped
    image: traefik:v3.7.0
    command:
      - --log.level=INFO
      - --accesslog=true
      - --api.dashboard=true
      - --api.insecure=true
      - --entrypoints.web.address=:8080
      - --entrypoints.traefik.address=:8081
      - --metrics.prometheus=true
      - --metrics.prometheus.entryPoint=traefik
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
    ports:
      - "8080:8080"
      - "127.0.0.1:8081:8081"
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      - edge

  postgres:
    profiles: ["dev"]
    restart: unless-stopped
    image: postgres:17.8
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - cluster

  rabbitmq:
    profiles: ["dev"]
    restart: unless-stopped
    image: rabbitmq:4.2-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - cluster

  garage:
    profiles: ["dev"]
    restart: unless-stopped
    image: dxflrs/garage:v2.2.0
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_METRICS_TOKEN: ${GARAGE_METRICS_TOKEN}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - edge
      - cluster

  # The published Garage image is a single static binary with no shell. Build a
  # small image that adds one so the idempotent bootstrap can run as a script.
  garage-init:
    profiles: ["dev"]
    build:
      context: ./garage
      dockerfile_inline: |
        FROM dxflrs/garage:v2.2.0 AS garage
        FROM alpine:3.22
        COPY --from=garage /garage /usr/local/bin/garage
        ENTRYPOINT ["/bin/sh", "/init.sh"]
    restart: "no"
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_ACCESS_KEY: ${GARAGE_ACCESS_KEY}
      GARAGE_SECRET_KEY: ${GARAGE_SECRET_KEY}
      GARAGE_BUCKET: ${GARAGE_BUCKET:-media}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - ./garage/init.sh:/init.sh:ro
      - garage-meta:/var/lib/garage/meta:ro
    depends_on:
      garage:
        condition: service_healthy
    networks:
      - cluster

  mailpit:
    profiles: ["dev"]
    restart: unless-stopped
    image: axllent/mailpit:v1.29.0
    ports:
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8025/api/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - cluster

  # One-shot schema upgrade. Every other backend service waits for it, so the
  # stack is usable as soon as `up` returns.
  migrate:
    profiles: ["dev"]
    build: *api-build
    command: ["alembic", "upgrade", "head"]
    environment:
      FIELDNOTE_ENVIRONMENT: ${FIELDNOTE_ENVIRONMENT:-development}
      FIELDNOTE_DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - cluster

  outbox-relay:
    profiles: ["dev"]
    build: *api-build
    command: ["python", "-m", "app.outbox_relay"]
    environment:
      FIELDNOTE_ENVIRONMENT: ${FIELDNOTE_ENVIRONMENT:-development}
      FIELDNOTE_DATABASE_URL: *database-url
      FIELDNOTE_RABBITMQ_URL: *rabbitmq-url
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cluster

  media-worker:
    profiles: ["dev"]
    build:
      context: ../../services/media-worker
    environment:
      FIELDNOTE_ENVIRONMENT: ${FIELDNOTE_ENVIRONMENT:-development}
      FIELDNOTE_DATABASE_URL: *database-url
      FIELDNOTE_S3_ENDPOINT: http://garage:3900
      FIELDNOTE_S3_BUCKET: ${GARAGE_BUCKET:-media}
      FIELDNOTE_S3_ACCESS_KEY: ${GARAGE_ACCESS_KEY}
      FIELDNOTE_S3_SECRET_KEY: ${GARAGE_SECRET_KEY}
      FIELDNOTE_S3_REGION: garage
      FIELDNOTE_RABBITMQ_URL: *rabbitmq-url
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - cluster

  api:
    profiles: ["dev"]
    restart: unless-stopped
    build: *api-build
    environment:
      FIELDNOTE_ENVIRONMENT: ${FIELDNOTE_ENVIRONMENT:-development}
      FIELDNOTE_DATABASE_URL: *database-url
      FIELDNOTE_S3_ENDPOINT: http://garage:3900
      FIELDNOTE_S3_BUCKET: ${GARAGE_BUCKET:-media}
      FIELDNOTE_S3_ACCESS_KEY: ${GARAGE_ACCESS_KEY}
      FIELDNOTE_S3_SECRET_KEY: ${GARAGE_SECRET_KEY}
      FIELDNOTE_S3_REGION: garage
      FIELDNOTE_SMTP_HOST: ${FIELDNOTE_SMTP_HOST:-mailpit}
      FIELDNOTE_SMTP_PORT: ${FIELDNOTE_SMTP_PORT:-1025}
      FIELDNOTE_RABBITMQ_URL: *rabbitmq-url
      # Origin of the gateway as the phones see it: 10.0.2.2 is the host from
      # inside the Android emulator.
      FIELDNOTE_MEDIA_PUBLIC_ENDPOINT: ${FIELDNOTE_MEDIA_PUBLIC_ENDPOINT:-http://10.0.2.2:8080}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/v1/health", timeout=2)
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
    networks:
      - edge
      - cluster

  # The erasure job runs once and exits; loop it so deletions that become due are picked up
  # within the interval. Several replicas could overlap safely, but the dev stack needs one.
  erasure-job:
    profiles: ["dev"]
    build: *api-build
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          python -m app.erasure_job || true
          sleep "$$ERASURE_JOB_INTERVAL_SECONDS"
        done
    environment:
      FIELDNOTE_ENVIRONMENT: ${FIELDNOTE_ENVIRONMENT:-development}
      FIELDNOTE_DATABASE_URL: *database-url
      FIELDNOTE_S3_ENDPOINT: http://garage:3900
      FIELDNOTE_S3_BUCKET: ${GARAGE_BUCKET:-media}
      FIELDNOTE_S3_ACCESS_KEY: ${GARAGE_ACCESS_KEY}
      FIELDNOTE_S3_SECRET_KEY: ${GARAGE_SECRET_KEY}
      FIELDNOTE_S3_REGION: garage
      ERASURE_JOB_INTERVAL_SECONDS: ${ERASURE_JOB_INTERVAL_SECONDS:-300}
    depends_on:
      migrate:
        condition: service_completed_successfully
      garage-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - cluster

  # One encrypted archive a day with the database dump and a copy of the media bucket. The key
  # is mounted read-only as a Compose secret and never enters the container image or .env.
  backup:
    profiles: ["dev"]
    build:
      context: ../../services/backup
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          python -m backup run || true
          sleep "$$BACKUP_INTERVAL_SECONDS"
        done
    environment:
      FIELDNOTE_ENVIRONMENT: ${FIELDNOTE_ENVIRONMENT:-development}
      FIELDNOTE_DATABASE_URL: *database-url
      FIELDNOTE_S3_ENDPOINT: http://garage:3900
      FIELDNOTE_S3_BUCKET: ${GARAGE_BUCKET:-media}
      FIELDNOTE_BACKUPS_BUCKET: ${BACKUP_BUCKET:-backups}
      FIELDNOTE_S3_ACCESS_KEY: ${GARAGE_ACCESS_KEY}
      FIELDNOTE_S3_SECRET_KEY: ${GARAGE_SECRET_KEY}
      FIELDNOTE_S3_REGION: garage
      FIELDNOTE_BACKUP_KEY_FILE: /run/secrets/backup.key
      FIELDNOTE_BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      FIELDNOTE_GARAGE_ADMIN_ENDPOINT: http://garage:3903
      FIELDNOTE_GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    secrets:
      - source: backup_key
        target: backup.key
    depends_on:
      migrate:
        condition: service_completed_successfully
      garage-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - cluster

  # The scheduler runs its own loop and takes the scheduler lease; two cluster replicas can
  # run together because only the lease holder plans.
  scheduler:
    profiles: ["dev"]
    build:
      context: ../../services/scheduler
    environment:
      FIELDNOTE_ENVIRONMENT: ${FIELDNOTE_ENVIRONMENT:-development}
      FIELDNOTE_DATABASE_URL: *database-url
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - cluster

  prometheus:
    profiles: ["dev"]
    image: prom/prometheus:v3.5.0
    # The Garage metrics token comes from the environment, so render it to the file the scrape
    # config points at before starting Prometheus.
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        set -eu
        mkdir -p /tmp/prometheus-secrets
        printf '%s' "$$GARAGE_METRICS_TOKEN" > /tmp/prometheus-secrets/garage_metrics_token
        exec /bin/prometheus \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --web.listen-address=0.0.0.0:9090
    environment:
      GARAGE_METRICS_TOKEN: ${GARAGE_METRICS_TOKEN:-garage-metrics-token-dev}
    volumes:
      - ./prometheus/prometheus.dev.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    # Traefik lives only on the edge network; the API, Garage and RabbitMQ are on both.
    networks:
      - edge
      - cluster

  grafana:
    profiles: ["dev"]
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-fieldnote-grafana-dev}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - cluster
