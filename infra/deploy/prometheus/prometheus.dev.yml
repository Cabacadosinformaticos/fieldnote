# Prometheus for the single-node development stack. Scraped over the Compose networks; the API
# metrics endpoint is not exposed through Traefik.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: fieldnote-api
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          replica: api

  - job_name: traefik
    static_configs:
      - targets: ["traefik:8081"]

  # The management image already enables rabbitmq_prometheus, which listens on 15692.
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  # The Garage admin API on 3903 protects /metrics with the metrics token. The entrypoint of the
  # Prometheus service writes that token from the environment to this file before it starts.
  - job_name: garage
    authorization:
      type: Bearer
      credentials_file: /tmp/prometheus-secrets/garage_metrics_token
    static_configs:
      - targets: ["garage:3903"]
