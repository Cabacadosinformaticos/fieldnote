metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 3

rpc_bind_addr = "[::]:3901"
# Each container renders its own service name here at start-up, so members
# find each other by Compose service name and never by IP address.
rpc_public_addr = "__RPC_PUBLIC_ADDR__"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"

[admin]
api_bind_addr = "[::]:3903"
