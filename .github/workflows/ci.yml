name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  services:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, scheduler, media-worker]
    # The API and scheduler tests create their own database in this server, as they do against
    # the dev stack; the media worker tests transcode with ffmpeg.
    services:
      postgres:
        image: postgres:17.8
        env:
          POSTGRES_USER: fieldnote
          POSTGRES_PASSWORD: fieldnote
          POSTGRES_DB: fieldnote
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fieldnote"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - if: matrix.service == 'media-worker'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  dashboard:
    name: dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
